id = "doct-code"
name = "Doct Code"
version = "0.1.0"
schema_version = 1
authors = ["Doct Team"]
description = "Doct Code Agent Server Extension for Zed"
repository = "https://github.com/DoctLM/doct-code"

[agent_servers.doct-code]
name = "Doct Code"
icon = "doct-code.svg"

[agent_servers.doct-code.targets.darwin-aarch64]
archive = "https://registry.npmjs.org/@doct-code/doct-code/-/doct-code-0.10.0.tgz"
cmd = "node"
args = ["./package/cli.js", "--acp"]

[agent_servers.doct-code.targets.darwin-x86_64]
archive = "https://registry.npmjs.org/@doct-code/doct-code/-/doct-code-0.10.0.tgz"
cmd = "node"
args = ["./package/cli.js", "--acp"]

[agent_servers.doct-code.targets.linux-x86_64]
archive = "https://registry.npmjs.org/@doct-code/doct-code/-/doct-code-0.10.0.tgz"
cmd = "node"
args = ["./package/cli.js", "--acp"]

[agent_servers.doct-code.targets.windows-x86_64]
archive = "https://registry.npmjs.org/@doct-code/doct-code/-/doct-code-0.10.0.tgz"
cmd = "node"
args = ["./package/cli.js", "--acp"]

